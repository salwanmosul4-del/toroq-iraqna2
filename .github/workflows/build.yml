name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Fetch map library (MapLibre GL JS)
      run: |
        mkdir -p www/lib
        npm pack maplibre-gl@4.7.1
        tar xzf maplibre-gl-4.7.1.tgz
        cp package/dist/maplibre-gl.js package/dist/maplibre-gl.css www/lib/
        test -s www/lib/maplibre-gl.js && echo "map library ok"

    - name: Create Cordova project and build
      run: |
        cordova create myapp com.turuq.iraqna ToroqIraqna
        cd myapp
        rm -rf www
        cp -r ../www .
        cp -f ../config.xml .
        cordova platform add android
        cordova plugin add cordova-plugin-geolocation
        cordova build android --debug
        
        # إنشاء مجلد جديد ونقل ملف الـ APK إليه لضمان رفعه بسهولة
        mkdir -p ../apk-output
        find platforms/android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} ../apk-output/ \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: apk-output/*.apk
