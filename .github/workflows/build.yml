name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Fetch map library (MapLibre GL JS)
      run: |
        mkdir -p www/lib
        npm pack maplibre-gl@4.7.1
        tar xzf maplibre-gl-4.7.1.tgz
        cp package/dist/maplibre-gl.js package/dist/maplibre-gl.css www/lib/
        test -s www/lib/maplibre-gl.js && echo "map library ok"

    - name: Create Cordova project and build
      run: |
        cordova create myapp com.turuq.iraqna ToroqIraqna
        cd myapp
        rm -rf www
        cp -r ../www .
        cp -f ../config.xml .
        cordova platform add android
        cordova plugin add cordova-plugin-geolocation
        cordova build android --debug

    - name: Find the APK
      run: |
        echo "APK files found:"
        find . -name "*.apk" -not -path "*/node_modules/*"
        mkdir -p out
        find . -name "*.apk" -not -path "*/node_modules/*" -not -path "./out/*" -exec cp {} out/app-debug.apk \; -quit
        ls -la out

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: out/app-debug.apk
        if-no-files-found: error

    - name: Publish APK to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Turuq build ${{ github.run_number }}
        files: out/app-debug.apk
